<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Letzter Außenposten</title>
<meta name="description" content="Idle-Aufbauspiel: Waren herstellen, Außenposten ausbauen, nachts Zombies abwehren.">
<meta name="theme-color" content="#17190f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Außenposten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#17190f; --panel:#23261a; --panel2:#30341f; --line:#454a30;
  --bone:#efe6d2; --muted:#b3ab92; --sand:#c9a86a; --rust:#c9642f;
  --gold:#f2c14e; --olive:#8d9a52; --danger:#e0503a; --ok:#9fc45a;
  --display:"Black Ops One", Impact, "Arial Black", sans-serif;
  --body:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden}
#cv{display:block;width:100%;height:100%}
button{font-family:var(--body);touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;align-items:center}
.top{width:100%;max-width:900px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;justify-content:space-between}
.left{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.pill{pointer-events:auto;background:rgba(23,25,15,.86);border:1.5px solid var(--line);border-radius:10px;
  padding:6px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.money{font-family:var(--display);font-size:22px;color:var(--gold);letter-spacing:.5px;font-variant-numeric:tabular-nums;min-width:96px}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe69a,#e0a92a 60%,#9c6d10);box-shadow:0 0 0 2px #6e4c0b inset}
.lvl{padding:4px 10px;gap:8px;font-size:12px;font-weight:700;color:var(--ok)}
.xpbar{width:70px;height:5px;border-radius:3px;background:#2c3a1c;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--ok);width:0}
.job{flex-direction:column;align-items:flex-start;gap:3px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--bone);max-width:220px}
.job b{color:var(--gold)}
.job .xpbar{width:100%}
.job .xpbar i{background:var(--gold)}
.day{flex-direction:column;align-items:flex-start;gap:3px;padding:5px 12px}
#dayLbl{font-family:var(--display);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sand)}
#dayInfo{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wallbar{width:130px;height:6px;border-radius:3px;background:#3a2c22;overflow:hidden}
.wallbar i{display:block;height:100%;width:100%;background:var(--danger);transition:width .2s}
.topbtns{display:flex;gap:6px;pointer-events:auto}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;font-size:14px;letter-spacing:.3px;
  background:var(--sand);color:#241c0e;box-shadow:0 3px 0 #7d6431}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7d6431}
.btn.dark{background:var(--panel2);color:var(--bone);box-shadow:0 3px 0 #0c0d07;border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.btn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
#hint{pointer-events:none;max-width:min(520px,calc(100vw - 32px));text-align:center;font-size:14px;font-weight:600;
  background:rgba(242,193,78,.94);color:#2a1f08;border-radius:8px;padding:7px 12px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#hint.night{background:rgba(224,80,58,.95);color:#fff}
#hint:empty{display:none}

#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
  font-family:var(--display);font-size:clamp(18px,4.2vw,30px);text-align:center;color:var(--bone);letter-spacing:1px;
  text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.7);transition:opacity .25s,transform .25s;width:min(90vw,640px)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

#ctx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:min(440px,calc(100vw - 24px));background:rgba(28,31,19,.95);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.ctx-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#ctxName{font-family:var(--display);font-size:18px;letter-spacing:1px;color:var(--bone)}
#ctxLvl{font-size:13px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
#ctxInfo{font-size:13px;color:var(--muted);line-height:1.4;font-variant-numeric:tabular-nums}
#ctxInfo b{color:var(--bone);font-weight:600}
#btnUp{padding:11px 8px}
.keys{font-size:11px;color:#7f7a66;text-align:center}

.modal{position:fixed;inset:0;background:rgba(8,9,5,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{width:min(470px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1.5px solid var(--line);
  border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 rgba(0,0,0,.45)}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:1px;color:var(--sand)}
.sheet h3{margin:6px 0 0;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sand)}
.sheet p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:8px 4px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--bone);border-color:var(--sand)}
.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.urow .n{font-weight:700;font-size:15px}
.urow .n small{color:var(--gold);font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.urow .d{grid-column:1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.urow .btn{grid-row:1 / span 2;grid-column:2;min-width:98px;font-variant-numeric:tabular-nums}
.minibar{height:5px;border-radius:3px;background:#2c3a1c;overflow:hidden;margin-top:4px;max-width:180px}
.minibar i{display:block;height:100%;background:var(--ok)}
.goal{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.goal .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.goal.done .ck{background:var(--ok);border-color:var(--ok);color:#1b2410}
.goal .gp{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.big{font-family:var(--display);font-size:34px;color:var(--gold);text-align:center}
.row-end{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (max-width:520px){
  .top{display:grid;grid-template-columns:1fr auto;gap:6px}
  .left{display:contents}
  .money{grid-column:1;grid-row:1;justify-self:start;font-size:19px;min-width:80px}
  .topbtns{grid-column:2;grid-row:1}
  .topbtns .btn{padding:7px 10px;font-size:13px}
  .lvl{grid-column:1;grid-row:2;justify-self:start;align-self:start}
  .day{grid-column:2;grid-row:2;padding:4px 10px}
  .wallbar{width:100%}
  .job{grid-column:1 / -1;grid-row:3;max-width:none}
  #hint{font-size:12.5px;padding:5px 10px}
}
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.wcard.here{border-color:var(--gold)}
.wcard.locked{opacity:.55}
.wnum{width:44px;height:44px;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--sand)}
.wcard.here .wnum{background:var(--gold);color:#2a1f08;border-color:var(--gold)}
.wname{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.wname small{font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:.3px}
.wdesc{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<style>html{-webkit-text-size-adjust:100%;background:#17190f}body{margin:0;overscroll-behavior:none}</style>
</head>
<body>


<div id="game"><canvas id="cv" aria-label="Spielfeld"></canvas></div>
<div id="hud">
  <div class="top">
    <div class="left">
      <div class="pill money" aria-label="Geld"><span class="coin"></span><span id="money">0</span></div>
      <div class="pill lvl"><span id="pLvl">Lv 1</span><div class="xpbar"><i id="pXp"></i></div></div>
      <div class="pill job" id="jobPill" hidden><span id="jobTxt"></span><div class="xpbar"><i id="jobBar"></i></div></div>
    </div>
    <div class="pill day"><span id="dayLbl">Tag 1</span><span id="dayInfo"></span><div class="wallbar" id="wallBar" hidden><i id="wallFill"></i></div></div>
    <div class="topbtns"><button class="btn dark" id="btnSound" aria-pressed="true">Ton an</button><button class="btn" id="btnMenu">Menü<span class="dot" id="menuDot" hidden></span></button></div>
  </div>
  <div id="hint"></div>
</div>
<div id="toast"></div>

<div id="ctx" hidden>
  <div class="ctx-head"><span id="ctxName"></span><span id="ctxLvl"></span></div>
  <div id="ctxInfo"></div>
  <button class="btn" id="btnUp"></button>
  <button class="btn dark" id="btnBelt" hidden></button>
  <div class="keys" id="ctxKeys">E = Ausbauen</div>
</div>

<div class="modal" id="menu" hidden>
  <div class="sheet" role="dialog" aria-labelledby="menuTitle">
    <div class="row-end"><h2 id="menuTitle">Bauernhof</h2><button class="btn dark" id="menuClose">Schließen</button></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="team" aria-selected="true">Team</button>
      <button class="tab" role="tab" data-tab="gear" aria-selected="false">Ausrüstung</button>
      <button class="tab" role="tab" data-tab="goals" aria-selected="false">Ziele</button>
      <button class="tab" role="tab" data-tab="ach" aria-selected="false">Erfolge</button>
    </div>
    <div id="menuBody"></div>
  </div>
</div>

<div class="modal" id="welcome" hidden>
  <div class="sheet" role="dialog" aria-labelledby="wTitle">
    <h2 id="wTitle">Willkommen zurück</h2>
    <p id="wText">Deine Arbeiter haben weitergearbeitet, während du weg warst.</p>
    <div class="big" id="wAmount">$0</div>
    <button class="btn" id="wOk">Einsammeln</button>
  </div>
</div>

<div class="modal" id="intro" hidden>
  <div class="sheet" role="dialog" aria-labelledby="iTitle">
    <h2 id="iTitle">Letzter Außenposten</h2>
    <div id="iBody"></div>
    <button class="btn" id="iOk">Los geht's</button>
  </div>
</div>

<div class="modal" id="world" hidden>
  <div class="sheet" role="dialog" aria-labelledby="worldTitle">
    <div class="row-end"><h2 id="worldTitle">Weltkarte</h2><button class="btn dark" id="worldClose">Schließen</button></div>
    <p>Jeder Außenposten hat seine eigene Kasse. Wenn du weg bist, arbeiten deine Leute dort weiter.</p>
    <div id="worldBody" class="wlist"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
// =====================================================================
//  WELT (gleich für alle Maps)
// =====================================================================
const W=1000, H=1200;
const COMP={x0:100,y0:100,x1:900,y1:900};
const GATE_X=500, GATE_HALF=46;
const COUNTER={x0:160,x1:840,y0:540,y1:568};
const STAFF_Y=520, CUST_Y=598;
const ROWS=[170,300,430], COLS=[180,340,500,660,820];
const SPOT_DY=50;
const CORR=[120,260,420,580,740,880];
const BIN={x:128,y:STAFF_Y};

const SAVE_KEY='letzter-aussenposten-v4', OLD_KEY='letzter-aussenposten-v3';

// ---------- Alle Waren ----------
const GOODS={
  apfel:{name:'Apfel',price:5}, ei:{name:'Ei',price:10}, weizen:{name:'Weizen',price:0}, mehl:{name:'Mehl',price:26},
  brot:{name:'Brot',price:58}, milch:{name:'Milch',price:85}, kaese:{name:'Käse',price:190},
  wasser:{name:'Wasser',price:0}, gemuese:{name:'Gemüse',price:14}, suppe:{name:'Suppe',price:55},
  kuchen:{name:'Kuchen',price:120}, sandwich:{name:'Sandwich',price:170}, eintopf:{name:'Eintopf',price:340},
  holz:{name:'Holz',price:40}, erz:{name:'Erz',price:0}, kohle:{name:'Kohle',price:0}, eisen:{name:'Eisen',price:170},
  naegel:{name:'Nägel',price:260}, werkzeug:{name:'Werkzeug',price:520}, pulver:{name:'Pulver',price:0}, munition:{name:'Munition',price:0},
  kupfer:{name:'Kupfer',price:70}, sand:{name:'Sand',price:90}, silizium:{name:'Silizium',price:420}, schaltkreis:{name:'Schaltkreis',price:1600}, batterie:{name:'Batterie',price:950}, roboter:{name:'Roboter',price:6500}, zahnrad:{name:'Zahnrad',price:380}, draht:{name:'Draht',price:320}, motor:{name:'Motor',price:1300}, moped:{name:'Moped',price:2900},
};

// ---------- Maps ----------
const MAPDEFS={
  farm:{
    id:'farm', name:'Bauernhof', num:1, next:'kueche', tables:null, zRunner:0, startMoney:0, staff:'Kassierer',
    staffDesc:'Sammelt das Geld an den Kassen automatisch ein.',
    theme:{work:'#6b8440',workDot:['40,60,20','170,200,110'],path:'rgba(120,92,52,.55)',floor:'#8a7355'},
    sty:{
      apfel: {name:'Apfelbaum',  out:'apfel', inp:[],        time:1.4, up:12},
      huhn:  {name:'Hühnerstall',out:'ei',    inp:[],        time:1.8, up:30},

      muehle:{name:'Mühle',      out:'mehl',  inp:['weizen'],time:1.8, up:90},

      kuh:   {name:'Kuhstall',   out:'milch', inp:[],        time:2.4, up:450},
      kaese: {name:'Käserei',    out:'kaese', inp:['milch'], time:2.8, up:1000},
    },
    order:['apfel','huhn','weizen','muehle','ofen','kuh','kaese'],
    inst:[
      {id:'apfel1', type:'apfel', c:2,r:2,cost:0},   {id:'huhn1',  type:'huhn',  c:1,r:2,cost:60},
      {id:'apfel2', type:'apfel', c:3,r:2,cost:150}, {id:'huhn2',  type:'huhn',  c:4,r:2,cost:400},
      {id:'weizen1',type:'weizen',c:1,r:1,cost:180}, {id:'muehle1',type:'muehle',c:2,r:1,cost:320},
      {id:'ofen1',  type:'ofen',  c:3,r:1,cost:800}, {id:'weizen2',type:'weizen',c:0,r:1,cost:900},
      {id:'muehle2',type:'muehle',c:4,r:1,cost:1500},{id:'kuh1',   type:'kuh',   c:1,r:0,cost:1800},
      {id:'kaese1', type:'kaese', c:2,r:0,cost:4200},{id:'ofen2',  type:'ofen',  c:4,r:0,cost:3500},
      {id:'kuh2',   type:'kuh',   c:0,r:0,cost:6000},{id:'kaese2', type:'kaese', c:3,r:0,cost:12000},
    ],
    sell:['apfel','ei','mehl','brot','milch','kaese'],
    crate:{ei:330,mehl:265,milch:200,apfel:670,brot:735,kaese:800},
    goals:[
      {text:'Alle 7 Stationsarten bauen', cur:()=>ORDER.filter(t=>typeBuilt(t)).length, max:7},
      {text:'3 Arbeiter einstellen',     cur:()=>S.workers.length, max:3},
      {text:'Insgesamt $20.000 verdienen',cur:()=>S.lifetime, max:20000, money:true},
      {text:'5 Nächte überstehen',        cur:()=>S.nights, max:5},
    ],
    intro:`<p><b style="color:var(--bone)">Map 1 · Bauernhof.</b> Stell dich an eine Station, um Waren herzustellen. Bring sie ins Verkaufslager an der Theke. Sobald Ware im Lager liegt, kommen Überlebende und kaufen ein. Je voller das Lager, desto mehr Kunden.</p>
      <p>Manche Waren brauchen mehrere Schritte: Weizen → Mühle → Mehl → Ofen → Brot. Arbeiter füllen das Lager von selbst. Nachts greifen Zombies die Mauer an.</p>
      <p><b style="color:var(--bone)">Steuerung:</b> Am Handy irgendwo aufs Feld tippen und ziehen. Am PC mit WASD/Pfeiltasten oder mit der Maus ziehen.</p>`,
  },
  kueche:{
    id:'kueche', name:'Dorfküche', num:2, next:'mine', zRunner:0.35, startMoney:100, staff:'Kellner',
    staffDesc:'Räumt die Tische ab und sammelt das Geld dort ein.',

      brett:    {name:'Brotzeitbrett',out:'sandwich',inp:['brot','kaese'],   time:2.2, up:1100},

    order:['beet','brunnen','topf','imp_mehl','imp_ei','backstube','imp_brot','imp_kaese','brett','kessel'],
    inst:[
      {id:'beet1',type:'beet',c:2,r:2,cost:0},          {id:'brunnen1',type:'brunnen',c:1,r:2,cost:80},
      {id:'topf1',type:'topf',c:3,r:2,cost:250},        {id:'beet2',type:'beet',c:4,r:2,cost:450},
      {id:'brunnen2',type:'brunnen',c:0,r:2,cost:700},
      {id:'imp_mehl1',type:'imp_mehl',c:1,r:1,cost:500},{id:'backstube1',type:'backstube',c:2,r:1,cost:1200},
      {id:'imp_ei1',type:'imp_ei',c:3,r:1,cost:700},    {id:'topf2',type:'topf',c:4,r:1,cost:2000},
      {id:'backstube2',type:'backstube',c:0,r:1,cost:6000},
      {id:'imp_brot1',type:'imp_brot',c:1,r:0,cost:2500},{id:'brett1',type:'brett',c:2,r:0,cost:5000},
      {id:'imp_kaese1',type:'imp_kaese',c:3,r:0,cost:3500},{id:'kessel1',type:'kessel',c:4,r:0,cost:12000},
      {id:'brett2',type:'brett',c:0,r:0,cost:15000},

function freshMap(id){
  const md=MAPDEFS[id];
  const s={id,money:md.startMoney,lifetime:0,day:1,phase:'day',phaseT:0,mapTime:0,nights:0,wallHp:0,last:Date.now(),lager:1,guards:0,cashiers:0,

    flags:{intro:0,made:0,deposited:0,sold:0,collected:0,cleaned:0,mapDone:0},belts:{}};
  md.inst.forEach(i=>s.inst[i.id]={unlocked:i.cost===0,paid:0});
  for(const k in md.sty) s.lv[k]=1;
  for(const g in GOODS) s.stock[g]=0;
  LANES.forEach(o=>s.lanes.push({unlocked:o.cost===0,paid:0,pile:0,pileN:0}));
  TURRETS.forEach(t=>s.tur[t.id]={unlocked:false,paid:0,level:1});
  UPG.forEach(u=>s.up[u.id]=0);
  if(md.tables) md.tables.forEach(t=>s.tables.push({unlocked:t.cost===0,paid:0,dirty:[false,false],money:0}));
  return s;
}
function fixMap(o,id){ // alten/unvollständigen Stand auffüllen
  const f=freshMap(id);
  for(const k in o){ if(o[k]===null||typeof o[k]!=='object') f[k]=o[k]; }
  for(const k of ['inst','lv','tur','up','flags','stock','belts']) f[k]=Object.assign(f[k],o[k]||{});
  if(o.contract) f.contract=o.contract;
  if(Array.isArray(o.lanes)) o.lanes.forEach((v,i)=>{ if(f.lanes[i]) Object.assign(f.lanes[i],v); });
  if(Array.isArray(o.tables)) o.tables.forEach((v,i)=>{ if(f.tables[i]) Object.assign(f.tables[i],v); });
  if(G.ach) delete G.ach.belt;
  if(Array.isArray(o.workers)) f.workers=o.workers.map(w=>({lvl:w.lvl||1,xp:w.xp||0,assign:w.assign||null,robot:!!w.robot}));
  f.id=id; return f;
}

      for(const id in (o.maps||{})) if(MAPDEFS[id]) G.maps[id]=fixMap(o.maps[id],id); }

function updateCustomers(dt){

      const wp=c.path[0];
      if(wp&&moveTo(c,wp.x,wp.y,c.sp,dt)) c.path.shift();
      if(!c.path.length){ if(c.state==='walk') c.state='queue'; else c.dead=true; }
    } else if(c.state==='queue'){
      const q=LR[c.lane].queue, i=q.indexOf(c), p=slotPos(c.lane,i);

  const pts=[{x:sp.x,y:sp.y},...planPath(sp,{x:cx,y:STAFF_Y}),{x:cx,y:COUNTER.y0-4}];

function beltPos(b,d){ let rest=d; for(let k=1;k<b.pts.length;k++){ const a=b.pts[k-1],c=b.pts[k],l=dist(a.x,a.y,c.x,c.y); if(rest<=l){ const f=l?rest/l:0; return {x:a.x+(c.x-a.x)*f,y:a.y+(c.y-a.y)*f}; } rest-=l; } return b.pts[b.pts.length-1]; }
function beltPut(inst,ent,g){ const b=BELTS[inst.id]; if(!b||!isDep(g)) return false;

function updateBelts(dt){

function removeOne(arr,g){const i=arr.indexOf(g); if(i>=0) arr.splice(i,1); return i>=0;}
function incoming(g,except){ let n=0; for(const w of workers){ if(w===except) continue; if(w.job&&w.job.g===g) n+=w.job.n; else n+=countIn(w.carry,g); } return n; }
function goTo(w,pt){ w.path=planPath(w,pt); }
function chooseJob(w){
  const data=S.workers[w.idx], cap=lagerCap();
  const sell=w.carry.filter(g=>isDep(g)&&hasRoom(g));
  if(sell.length){ w.job={type:'deposit',g:null,n:0,made:0}; goTo(w,{x:CRATE[sell[0]],y:STAFF_Y}); return; }
  if(w.carry.some(g=>!isDep(g))){ w.carry=w.carry.filter(g=>isDep(g)); }
  if(w.carry.length){ w.think=2; return; }
  let best=null,bs=1e9; const list=orderable(); const as=data.assign;
  if(as&&isSpecial(as)&&chainReady(as)&&(G.ammo+incoming(as,w))<AMMO_CAP) best=as;

function newContract(){

  for(const x of list){ if((r-=dw[x])<=0){g=x;break;} }

  const n=Math.max(3,Math.round((4+Math.random()*4)*Math.sqrt(crew)/(steps>1?1.3:1)/(multiChain(g)?1.4:1)));
  const time=Math.min(300,Math.round(60+n*7*steps/Math.sqrt(crew)));

}

function collide(e){

    if(ox>0&&oy>0){ if(ox<oy) e.x+=ox*Math.sign(e.x-cx||1); else e.y+=oy*Math.sign(e.y-cy||1); }};
  for(const i of INST) if(S.inst[i.id].unlocked) push(i.x,i.y,38+10,30+12);
  push((COUNTER.x0+COUNTER.x1)/2,(COUNTER.y0+COUNTER.y1)/2,(COUNTER.x1-COUNTER.x0)/2+9,(COUNTER.y1-COUNTER.y0)/2+10);
  for(const t of TURRETS) if(S.tur[t.id].unlocked) push(t.x,t.y-6,40,32);
}
function payInto(obj,cost,dt,onDone){

}

  globs=globs.filter(g=>!g.hit);
  P.cd-=dt;
  if(P.cd<=0){ const t=shoot(P.x,P.y-6,250,gunDmg(),'p'); if(t){P.cd=1/gunRate();P.face=Math.atan2(t.y-P.y,t.x-P.x);P.aimT=0.3;beep(300,.04,'square',.025,-150);} }
  repairing=dist(P.x,P.y,REPAIR.x,REPAIR.y)<70&&S.wallHp<wallMax();
  if(repairing){ S.wallHp=Math.min(wallMax(),S.wallHp+repairRate()*dt); if(Math.random()<dt*6) parts.push({x:REPAIR.x+Math.random()*80-40,y:COMP.y1-6,vx:Math.random()*40-20,vy:-80,t:0,life:.5,color:'#f2c14e',r:3}); }
  for(const t of TURRETS){ const s=S.tur[t.id]; if(!s.unlocked) continue; const rt=TR[t.id];
    if(rt.stun>0){ rt.stun-=dt; continue; }
    rt.cd-=dt; if(rt.cd<=0){ const z=shoot(t.x,t.y-24,280+30*S.up.light,turretDmg(s.level),'t'); if(z){rt.cd=1/turretRate(s.level);rt.angle=Math.atan2(z.y-t.y,z.x-t.x);rt.flash=.07;} } }
  for(const w of workers){ if(!S.workers[w.idx].robot) continue; w.cd=(w.cd||0)-dt;
    if(w.cd<=0){ const z=shoot(w.x,w.y-22,700,guardDmg()*1.2,'r'); if(z) w.cd=1; } }
  for(const g of guards){ g.cd-=dt; if(g.cd<=0){ const z=shoot(g.x,g.y-14,240,guardDmg(),'g'); if(z){ g.cd=1/1.3; g.face=Math.atan2(z.y-g.y,z.x-g.x); } } }
  zombies=zombies.filter(z=>!z.dead);
  if(S.wallHp<=0){ const loss=Math.floor(S.money*0.2); S.money-=loss; zombies=[];
    S.phase='day'; S.phaseT=0; S.day++; S.wallHp=wallMax();
    toast('Die Mauer ist gefallen! Plünderer nehmen $'+fmt(loss)+'. Rüste die Verteidigung auf.',3800); beep(120,.6,'sawtooth',.06,-60); save(); return; }
  if(zSpawnLeft===0&&zombies.length===0) endNight(true);
  else if(S.phaseT>NIGHT_MAX){ toast('Die Sonne geht auf – die Zombies ziehen ab.'); endNight(false); }
}

function doUpgrade(n){
  if(n.inst){ const t=n.inst.type; if(S.lv[t]>=ST_MAX) return; const c=stUpCost(t); if(S.money<c) return;
    S.money-=c; S.lv[t]++; burst(n.inst.x,n.inst.y-20,'#f2c14e',14); }
  else if(n.tur){ const t=n.tur, s=S.tur[t.id]; if(s.level>=ST_MAX) return; const c=turUpCost(t); if(S.money<c) return;
    S.money-=c; s.level++; burst(t.x,t.y-20,'#f2c14e',14); }
  else if(n.lager){ if(S.lager>=LAGER_MAX) return; const c=lagerCost(); if(S.money<c) return; S.money-=c; S.lager++; burst(P.x,COUNTER.y0,'#f2c14e',14); }
  beep(700,.08,'square',.045,500); refreshCtx(); save();
}
$('btnUp').onclick=()=>{initAudio(); if(near) doUpgrade(near);};
$('btnBelt').onclick=()=>{ initAudio(); if(!near||!near.inst||!beltsAllowed()) return; const i=near.inst; if(S.belts[i.id]) return; const c=beltCost(i); if(S.money<c) return;
  S.money-=c; S.belts[i.id]=true; buildBelt(i); burst(i.x,i.y+SPOT_DY,'#f2c14e',20); beep(600,.15,'square',.05,300); toast('Förderband gebaut!'); refreshCtx(); save(); };
function setText(el,v){if(el._v!==v){el._v=v;el.innerHTML=v;}}
function refreshCtx(){
  const n=near, box=$('ctx');
  if(!n){ if(!box.hidden) box.hidden=true; return; }
  box.hidden=false;
  let name,lvl,cost,info,max;
  if(n.inst){ const t=n.inst.type, st=STY[t]; lvl=S.lv[t]; max=lvl>=ST_MAX; cost=stUpCost(t); name=st.name;
    const g=st.out, sell=isSell(g);
    const nb=INST.filter(i=>i.type===t&&S.inst[i.id].unlocked).length;
    info=(st.inp.length?`Macht <b>${GOODS[g].name}</b> aus ${st.inp.map(x=>GOODS[x].name).join(' + ')}`:`Liefert <b>${GOODS[g].name}</b>`)+` · ${prodTime(t).toFixed(1).replace('.',',')} s`+
      (sell?` · Wert <b>$${fmt(goodPrice(g))}</b>`+(max?'':` → $${fmt(GOODS[g].price*(1+0.25*lvl))}`):' · Zutat')+
      (nb>1?` · ${nb} Stationen`:'')+
      (st.imp?(()=>{const src=impSrc(t);return `<br>Kommt aus ${MAPDEFS[src.map].name}: ${MAPDEFS[src.map].sty[src.type].name} dort Stufe ${G.maps[src.map]?G.maps[src.map].lv[src.type]:1} → +${Math.round((farmBoost(t)-1)*100)} % Tempo`;})():`<br>Ausbau gilt für alle ${st.name}-Stationen.`);
  } else if(n.tur){ const t=n.tur,s=S.tur[t.id]; lvl=s.level; max=lvl>=ST_MAX; cost=turUpCost(t); name=t.name;
    info=`Schießt nachts auf Zombies. Schaden <b>${Math.round(turretDmg(lvl))}</b>`+(max?'':` → <b>${Math.round(turretDmg(lvl+1))}</b>`)+` · ${turretRate(lvl).toFixed(1).replace('.',',')} Schuss/s`;
  } else { lvl=S.lager; max=lvl>=LAGER_MAX; cost=lagerCost(); name='Verkaufslager';
    const cap=lagerCap(); const list=orderable().map(g=>`${GOODS[g].name} <b>${S.stock[g]}/${cap}</b>`).join(' · ');
    info=`Platz pro Ware: <b>${cap}</b>`+(max?'':` → <b>${cap+4}</b>`)+`<br>${list||'Noch keine Ware.'}`; }
  setText($('ctxName'),name); setText($('ctxLvl'),'Stufe '+lvl+(max?' (max)':'')); setText($('ctxInfo'),info);
  const bu=$('btnUp'); setText(bu,max?'Maximale Stufe':'Ausbauen · $'+fmt(cost)); bu.disabled=max||S.money<cost;
  const bb=$('btnBelt');
  if(n.inst&&beltsAllowed()&&CRATE[STY[n.inst.type].out]!=null){ bb.hidden=false;
    if(S.belts[n.inst.id]){ setText(bb,'Förderband läuft ✓'); bb.disabled=true; }
    else { const c=beltCost(n.inst); setText(bb,'Förderband zum Lager · $'+fmt(c)); bb.disabled=S.money<c; } }
  else bb.hidden=true;
  $('ctxKeys').hidden=matchMedia('(pointer:coarse)').matches;
}

  checkAch(0.12);
  const canHire=humans()<MAX_WORKERS&&S.money>=hireCost();
  const done=goalsDone(); if(done&&!S.flags.mapDone){ S.flags.mapDone=1; save(); toast(MD.next?'Alle Ziele erfüllt! '+MAPDEFS[MD.next].name+' ist freigeschaltet.':'Alle Ziele erfüllt!',3500); }
  $('menuDot').hidden=!(canHire||(done&&MD.next&&!G.maps[MD.next]));
  if(!$('menu').hidden&&(tab!=='gear'||(!codeDraft&&(!document.activeElement||document.activeElement.id!=='codeIn')))){ menuRefreshT-=0.12; if(menuRefreshT<=0){ menuRefreshT=1; renderMenu(); } }
}

// =====================================================================
//  OFFLINE / WÄHREND DU WEG WARST
// =====================================================================
function offline(){
  const el=(Date.now()-(S.last||Date.now()))/1000; if(el<60||!S.workers.length) return;
  const list=orderable(); if(!list.length) return;
  const dw=demandW(); let sum=0,avg=0; list.forEach(g=>{sum+=dw[g];avg+=dw[g]*goodPrice(g);}); avg/=sum;
  let perSec=0; for(const w of S.workers) perSec+=avg*workerCap(w.lvl)/40*prodMul(w.lvl)/(MD.tables?1.6:1);
  const t=Math.min(el,3*3600), gain=Math.floor(perSec*t*(S.cashiers?0.6:0.45));
  if(gain<1) return;
  const hrs=Math.floor(t/3600), mins=Math.floor(t%3600/60);
  $('wTitle').textContent=MD.name;
  $('wText').textContent=`Deine Arbeiter haben ${hrs?hrs+' Std. ':''}${mins} Min. weitergearbeitet${el>3*3600?' (höchstens 3 Stunden zählen)':''}.`;
  $('wAmount').textContent='+$'+fmt(gain); $('welcome').hidden=false;
  $('wOk').onclick=()=>{initAudio();S.money+=gain;S.lifetime+=gain;$('welcome').hidden=true;beep(1000,.12,'square',.05,600);save();};
}

// =====================================================================
//  START
// =====================================================================
load();
setupMap(G.cur);
buildRuntime();
if(!S.flags.intro) showIntro(); else offline();
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('pagehide',save);

let lt=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lt)/1000); lt=now;
  const paused=!$('intro').hidden||!$('welcome').hidden||!$('world').hidden;
  try{ if(!paused) update(dt); render(now/1000); hud(dt); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game={get S(){return S},get G(){return G},P,get INSTBY(){return INSTBY},get customers(){return customers},get workers(){return workers},get zombies(){return zombies},startNight,travelTo,openWorld,openMenu,newContract,
  addWorker(){S.workers.push({lvl:1,xp:0,assign:null});workers.push(makeWorker(S.workers.length-1));},
  addGuard(){guards.push(makeGuard(S.guards));S.guards++;},
  addCashier(){cashiers.push(makeCashier(S.cashiers));S.cashiers++;}};
})();
</script>

<script>
window.APP_VERSION='1.0.0';
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  let waiting=null, reloading=false;
  const bar=document.getElementById('updBar');
  const show=w=>{ waiting=w; bar.hidden=false; };
  document.getElementById('updBtn').onclick=()=>{ if(waiting) waiting.postMessage('SKIP_WAITING'); };
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloading) return; reloading=true; location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const nw=reg.installing; nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller) show(nw); }); });
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{});
}
</script>
